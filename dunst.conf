# ────────────────────────────────────────────────────────────
# Omarchy Theme for Dunst (Notification Daemon)
# ────────────────────────────────────────────────────────────

[global]
    # Display
    monitor = 0
    follow = mouse
    geometry = "300x50-10+10"
    indicate_hidden = yes
    shrink = no
    transparency = 0
    notification_height = 0
    separator_height = 2
    padding = 8
    horizontal_padding = 8
    frame_width = 2
    frame_color = "#2B2C2B"
    separator_color = "#2B2C2B"
    sort = yes
    idle_threshold = 120

    # Text
    font = Monospace 10
    line_height = 0
    markup = full
    format = "<b>%s</b>\n%b"
    alignment = left
    vertical_alignment = center
    show_age_threshold = 60
    word_wrap = yes
    ellipsize = middle
    ignore_newline = no
    stack_duplicates = yes
    hide_duplicate_count = false
    show_indicators = yes

    # Icons
    icon_position = left
    min_icon_size = 0
    max_icon_size = 32
    icon_path = /usr/share/icons/hicolor/32x32/apps:/usr/share/icons/hicolor/48x48/apps

    # History
    sticky_history = yes
    history_length = 20

    # Misc/Advanced
    dmenu = /usr/bin/dmenu -p dunst:
    browser = /usr/bin/firefox -new-tab
    always_run_script = true
    title = Dunst
    class = Dunst
    startup_notification = false
    force_xwayland = false
    force_xinerama = false

[urgency_low]
    background = "#151515"
    foreground = "#E1DEDE"
    timeout = 3
    icon = dialog-information

[urgency_normal]
    background = "#151515"
    foreground = "#E1DEDE"
    timeout = 5
    icon = dialog-warning

[urgency_critical]
    background = "#9a8e8e"
    foreground = "#edecec"
    frame_color = "#9a8e8e"
    timeout = 0
    icon = dialog-error

# vim: ft=cfg
